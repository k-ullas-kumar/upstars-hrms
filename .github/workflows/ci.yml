name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrms_BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hrms_BE/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrms_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hrms_FE/package-lock.json
      - run: npm ci
      - run: npm run build
